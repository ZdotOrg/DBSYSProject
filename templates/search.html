{% extends "base.html" %}

{% block title %}Home - Anime Tracker{% endblock %}

{% block content %}
<div class="container">
    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to Your Anime Tracker</h1>
        <p>Track, rate, and discover your next favorite anime</p>
        
        <!-- User Stats -->
        <div class="stats-grid" id="userStats">
            <div class="stat-card">
                <div class="stat-number" id="totalAnime">0</div>
                <div class="stat-label">Total Anime</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedCount">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="watchingCount">0</div>
                <div class="stat-label">Watching</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avgRating">0.0</div>
                <div class="stat-label">Avg Rating</div>
            </div>
        </div>
    </section>

    <!-- Featured Anime -->
    <section class="anime-section">
        <h2>Popular Anime</h2>
        <div class="anime-grid" id="popularAnime">
            <!-- Populated by JavaScript -->
        </div>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/home.js') }}"></script>
{% endblock %}
