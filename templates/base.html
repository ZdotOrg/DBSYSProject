<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Anime Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="{{ url_for('main.index') }}">Anime Tracker</a>
            </div>
            <div class="nav-links">
                <a href="{{ url_for('main.index') }}">Home</a>
                <a href="{{ url_for('main.search') }}">Search</a>
                <a href="{{ url_for('main.watchlist') }}">Watchlist</a>
                <a href="{{ url_for('main.recommendations') }}">Recommendations</a>
            </div>
        </div>
    </nav>
 
    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
 
    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2024 Anime Tracker. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
